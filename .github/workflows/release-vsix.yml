name: Build & Publish UnityBrain VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to VS Code Marketplace (requires secrets.VSCE_PAT)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify workspace dependencies
        run: node tools/cli.mjs install

      - name: Typecheck
        run: node tools/cli.mjs typecheck

      - name: Build universal Release (.NET Standard 2.0 Analyzers + .NET 8 Daemon + LSP + Extension)
        env:
          UseNuGetNetStandard: 'true'
          UseNet8Release: 'true'
        run: node tools/cli.mjs build

      - name: Run TypeScript workspace tests
        run: node tools/cli.mjs test

      - name: Run .NET Analyzers tests
        run: dotnet test analyzers/UnityBrain.Analyzers.Tests/UnityBrain.Analyzers.Tests.csproj --no-restore -nodeReuse:false -p:UseSharedCompilation=false

      - name: Run .NET Daemon tests
        run: dotnet test packages/unity-daemon/UnityBrain.Daemon.Tests/UnityBrain.Daemon.Tests.csproj --no-restore -nodeReuse:false -p:UseSharedCompilation=false

      - name: Package VSIX
        run: node tools/cli.mjs package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitybrain-vsix
          path: dist/unitybrain-*.vsix
          if-no-files-found: error

      - name: Attach VSIX to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/unitybrain-*.vsix
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: (inputs.publish_marketplace == true || startsWith(github.ref, 'refs/tags/v')) && secrets.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath dist/unitybrain-*.vsix
